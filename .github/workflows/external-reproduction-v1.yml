name: F124 External GNC Reproduction
on:
  workflow_dispatch:
  push:
    paths: ['runtime/external_reproduction_v1.py','.github/workflows/external-reproduction-v1.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install scipy==1.15.3\n      - run: python runtime/external_reproduction_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: f124-external-reproduction-v1
          path: artifacts/f124_external_reproduction.json
